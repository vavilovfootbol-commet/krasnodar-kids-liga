name: Auto Sync Football Leagues

on:
  schedule:
    - cron: '0 9,18 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать код из репозитория
        uses: actions/checkout@v4

      - name: становить Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: становить зависимости
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: осстановить секретные ключи (.env и credentials.json)
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
        run: |
          printf '%s\n' "$ENV_FILE" > .env
          printf '%s\n' "$CREDENTIALS_JSON" > credentials.json
          python -c "import json; json.load(open('credentials.json')); print('credentials.json OK')"

      - name: апустить сканирование лиг и Vision-распознавание
        run: python auto_sync.py
