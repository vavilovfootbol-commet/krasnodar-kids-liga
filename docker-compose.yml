services:
  bot:
    build: .
    container_name: kkl_bot
    restart: always
    env_file:
      - .env
    volumes:
      - ./credentials.json:/app/credentials.json:ro
    command: python tg_bot.py

  web:
    build: .
    container_name: kkl_web
    restart: always
    env_file:
      - .env
    volumes:
      - ./credentials.json:/app/credentials.json:ro
    ports:
      - "8000:8000"
    command: uvicorn web_app:app --host 0.0.0.0 --port 8000
